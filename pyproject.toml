[project]
name = "experiment-forecast"
version = "0.1.0"
description = "Agentic optimization loop for Homerunner shipment volume forecasting"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=15",
    "numpy>=1.26",
    "pyyaml>=6",
    "holidays>=0.50",
]

[project.optional-dependencies]
models = [
    "lightgbm>=4.3",
    "statsmodels>=0.14",
]

[tool.uv]
package = false
